name: Cross-platform TUN + Prism tests

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Unit tests with race detector
        run: go test -race -count=1 -timeout 300s ./...
      - name: Real /dev/net/tun + real Prism e2e (mipsle via QEMU)
        run: |
          sudo apt-get install -y qemu-user
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go test -c -o /tmp/prism-test-mipsle ./test/
          sudo unshare --net bash -c \
            'PRISM_ROOT_TEST=1 qemu-mipsel /tmp/prism-test-mipsle -test.v -test.run "TestLinuxTUNDevice|TestRealTUNWithRealPrism" -test.timeout 120s'
      - name: Real /dev/net/tun + real Prism e2e (native x86-64)
        run: |
          go test -c -o /tmp/prism-test-amd64 ./test/
          sudo unshare --net bash -c \
            'PRISM_ROOT_TEST=1 /tmp/prism-test-amd64 -test.v -test.run "TestLinuxTUNDevice|TestRealTUNWithRealPrism" -test.timeout 60s'
      - name: Production TUN captures IPv4 + IPv6 TCP/UDP (WebRTC leak guard)
        run: |
          go test -c -o /tmp/prism-client-test ./cmd/prism-client/
          sudo unshare --net bash -c \
            'PRISM_ROOT_TEST=1 /tmp/prism-client-test -test.v -test.run "TestTUNCapturesIPv4AndIPv6" -test.timeout 90s'
      - name: Kill switch, full production ruleset (nftables, isolated netns)
        run: |
          sudo unshare --net bash -c \
            'PRISM_ROOT_TEST=1 /tmp/prism-client-test -test.v -test.run "TestKillSwitch$" -test.timeout 120s'
      - name: Kill switch survives a real reboot (systemd machine restarted for real)
        run: ./scripts/test-killswitch-reboot.sh
      - name: Real Chrome / Edge obey the WebRTC guard (no STUN from the real address)
        run: sudo PRISM_BROWSER_TEST=1 /tmp/prism-client-test -test.v -test.run 'TestChromiumHonoursWebRTCGuard' -test.timeout 300s
      - name: Real Firefox obeys the WebRTC guard
        run: PRISM_BROWSER_TEST=1 /tmp/prism-client-test -test.v -test.run 'TestFirefoxHonoursWebRTCGuard' -test.timeout 300s
      - name: Fuzz protocol parsers and handshakes (short)
        run: |
          for f in FuzzDecodeAddr FuzzReadDatagram FuzzStealAndClientHello FuzzServerHandshakes FuzzDispatch; do
            go test ./pkg/prism/ -run '^$' -fuzz "^${f}\$" -fuzztime 15s
          done
      - name: ECH live tests
        run: PRISM_LIVE_TEST=1 go test -v -run "TestECHHandshakeLive|TestECHWithPrismSession" -count=1 -timeout 60s ./test/ ./pkg/prism/
      - name: Cross-compile router (mipsle)
        run: GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -o /dev/null ./cmd/prism-client/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Unit tests
        run: go test -race -count=1 -timeout 300s ./...
      - name: Real macOS utun device test
        run: sudo PRISM_ROOT_TEST=1 go test -v -run "TestDarwinUTunDevice" -count=1 -timeout 60s ./test/
      - name: Real macOS utun + real Prism e2e
        run: sudo PRISM_ROOT_TEST=1 go test -v -run "TestDarwinUTunWithRealPrism" -count=1 -timeout 60s ./test/
      - name: Production utun captures IPv4 + IPv6 TCP/UDP (WebRTC leak guard)
        run: |
          go test -c -o /tmp/prism-client-test ./cmd/prism-client/
          sudo PRISM_ROOT_TEST=1 /tmp/prism-client-test -test.v -test.run "TestTUNCapturesIPv4AndIPv6" -test.timeout 90s
      - name: Kill switch on real pf + utun
        run: sudo PRISM_ROOT_TEST=1 /tmp/prism-client-test -test.v -test.run 'TestKillSwitch$' -test.timeout 120s
      - name: WebRTC browser policy via real defaults
        run: /tmp/prism-client-test -test.v -test.run 'TestChromiumWebRTCDefaults'
      - name: Real Chrome / Edge obey the WebRTC guard (no STUN from the real address)
        run: PRISM_BROWSER_TEST=1 /tmp/prism-client-test -test.v -test.run 'TestChromiumHonoursWebRTCGuard|TestFirefoxHonoursWebRTCGuard' -test.timeout 400s
      - name: "System proxy + DNS on real macOS network services (repoints the machine briefly, so last)"
        run: sudo PRISM_SYSCFG_TEST=1 /tmp/prism-client-test -test.v -test.run 'TestSystemProxyAndDNSRoundTrip' -test.timeout 120s

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Download wintun.dll
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun
          Copy-Item wintun\wintun\bin\amd64\wintun.dll .
      - name: Unit tests
        run: go test -race -count=1 -timeout 300s ./...
      - name: Wintun adapter test (real Windows)
        shell: cmd
        run: |
          go test -c -o wintun-test.exe ./cmd/prism-client/
          set PRISM_ROOT_TEST=1
          wintun-test.exe -test.v -test.run "TestWintunAdapterCreate|TestWintunOpenTUN|TestTUNCapturesIPv4AndIPv6" -test.timeout 120s
      - name: Real Chrome / Edge obey the WebRTC guard (no STUN from the real address)
        shell: cmd
        run: |
          set PRISM_BROWSER_TEST=1
          wintun-test.exe -test.v -test.run "TestChromiumHonoursWebRTCGuard|TestFirefoxHonoursWebRTCGuard" -test.timeout 400s
      - name: Kill switch on real Windows Firewall + wintun
        shell: cmd
        run: |
          set PRISM_ROOT_TEST=1
          wintun-test.exe -test.v -test.run "TestKillSwitch$" -test.timeout 180s
      - name: "System proxy + DNS on real Windows settings (repoints the machine briefly, so last)"
        shell: cmd
        run: |
          set PRISM_SYSCFG_TEST=1
          wintun-test.exe -test.v -test.run "TestSystemProxyAndDNSRoundTrip|TestChromiumWebRTCRegistry" -test.timeout 120s
