# Nikki / Mihomo (Clash.Meta) 片段：把出国流量路由进本机的 prism-client SOCKS5。
# prism-client 以路由器模式运行，监听 127.0.0.1:1080；Mihomo 负责 LAN 透明代理/TUN 与分流。
#
# Prism 现已支持 UDP（SOCKS5 UDP ASSOCIATE，经 UDP-over-stream 转发），
# 故 UDP（含 QUIC/DNS/实时音视频）也可直接走 PRISM-SG，无需再拒绝 QUIC。

proxies:
  - name: "PRISM-SG"
    type: socks5
    server: 127.0.0.1
    port: 1080
    udp: true

proxy-groups:
  - name: "出国"
    type: select
    proxies:
      - "PRISM-SG"
      - "DIRECT"

rules:
  # 1) 国内直连
  - GEOIP,CN,DIRECT,no-resolve
  # 2) 其余全部走新加坡出口（TCP 与 UDP 皆可）
  - MATCH,出国
  # 备注：若你的 QUIC 走 UDP-over-stream 体验不佳，也可只对 UDP/443 做 REJECT
  #       逼浏览器回落到 TCP：  - AND,((NETWORK,udp),(DST-PORT,443)),REJECT

# 提示：如果你用 Mihomo 的 TUN 模式做全局接管，确保 prism-client 到新加坡的
# 直连流量本身不要再被 TUN 回环（给 prism-client 进程或其目的IP加 DIRECT 例外），
# 否则会环路。常见做法是按进程名 PROCESS-NAME,prism-client,DIRECT 放行。
